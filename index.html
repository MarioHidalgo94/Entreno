<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1318">
<title>Registro de entrenamiento</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--iron:#0F1318;--plate:#1A2029;--plate-hi:#232B36;--edge:#2E3845;
  --chalk:#F2F4F7;--dust:#8A94A3;--brass:#C9A227;--brass-dim:#5A4A16;--warm:#C96A47}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--iron);color:var(--chalk);font-family:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  font-size:16px;padding-bottom:5.5rem;overscroll-behavior-y:contain}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:20;background:rgba(15,19,24,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--edge);padding:calc(env(safe-area-inset-top) + .55rem) 1rem .5rem}
.viewtabs{display:flex;gap:.95rem;margin-bottom:.5rem}
.viewtabs button{background:none;border:0;padding:0 0 .3rem;color:var(--dust);font:inherit;
  font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;cursor:pointer;
  border-bottom:2px solid transparent}
.viewtabs button[aria-pressed="true"]{color:var(--chalk);border-bottom-color:var(--brass)}
.head-top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:1.8rem;line-height:1;
  letter-spacing:.02em;text-transform:uppercase;margin:0}
.muscles{color:var(--dust);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-top:.3rem}
.session-vol{text-align:right;flex-shrink:0}
.session-vol .v{font-family:Anton,Impact,sans-serif;font-size:1.5rem;line-height:1;color:var(--brass)}
.session-vol .l{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dust)}
.controls{display:flex;gap:.5rem;margin-top:.7rem}
.seg{display:flex;flex:1;background:var(--plate);border:1px solid var(--edge);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--dust);font:inherit;font-size:.78rem;
  font-weight:600;padding:.5rem 0;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--plate-hi);color:var(--chalk)}
.seg button.done::after{content:"";display:block;width:4px;height:4px;border-radius:50%;
  background:var(--brass);margin:.22rem auto 0}
select{background:var(--plate);color:var(--chalk);border:1px solid var(--edge);border-radius:10px;
  padding:.5rem .6rem;font:inherit;font-size:.78rem;font-weight:600;max-width:100%}
.clockbar{display:flex;align-items:center;gap:.5rem;margin-top:.55rem}
.clockbar .t{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:600;min-width:4.6rem}
.clockbar .t.run{color:var(--brass)}
.mini{background:var(--plate);border:1px solid var(--edge);color:var(--chalk);font:inherit;
  font-size:.72rem;font-weight:600;padding:.42rem .7rem;border-radius:9px;cursor:pointer}
.mini.on{background:var(--brass);border-color:var(--brass);color:#0F1318}
.clockbar .sp{flex:1}

main{padding:.9rem 1rem 0}
.ex{background:var(--plate);border:1px solid var(--edge);border-radius:14px;margin-bottom:.8rem;overflow:hidden}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.8rem .9rem .6rem}
.ex-name{font-weight:600;font-size:1rem;line-height:1.25}
.ex-range{color:var(--dust);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;margin-top:.22rem}
.kgbox{flex-shrink:0;text-align:center}
.kgbox input{width:5.2rem;background:var(--plate-hi);border:1px solid var(--edge);color:var(--brass);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:600;
  text-align:center;padding:.5rem .2rem;border-radius:10px;-moz-appearance:textfield}
.kgbox input:focus{outline:none;border-color:var(--brass);background:#28313d}
.kgbox .l{font-size:.55rem;text-transform:uppercase;letter-spacing:.11em;color:var(--dust);margin-top:.18rem}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder{color:var(--brass-dim);font-weight:600}

table{width:100%;border-collapse:collapse}
th{font-size:.55rem;text-transform:uppercase;letter-spacing:.11em;color:var(--dust);
  font-weight:500;padding:0 .35rem .3rem;text-align:center}
th:first-child{text-align:left;padding-left:.9rem}
td{padding:.18rem .35rem;vertical-align:middle}
.s-label{padding-left:.9rem;font-size:.75rem;font-weight:600;color:var(--dust);
  font-family:"IBM Plex Mono",monospace;width:2.3rem}
.reps{width:100%;background:var(--plate-hi);border:1px solid transparent;color:var(--chalk);
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600;
  text-align:center;padding:.55rem .2rem;border-radius:9px;-moz-appearance:textfield}
.reps:focus{outline:none;border-color:var(--brass);background:#28313d}
.reps.filled{border-color:var(--edge)}
.reps.bajo{color:var(--warm)}
.scale{display:flex;gap:2px;align-items:flex-end;height:20px;padding:0 .1rem}
.tick{flex:1;background:var(--edge);border-radius:1px;height:6px}
.tick.on{background:var(--dust);height:12px}
.tick.top{background:var(--brass);height:18px}
.rir{display:flex;gap:2px}
.rir button{flex:1;background:var(--plate-hi);border:1px solid transparent;color:var(--dust);
  font-family:"IBM Plex Mono",monospace;font-size:.8rem;font-weight:600;padding:.55rem 0;
  border-radius:9px;cursor:pointer}
.rir button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0F1318}

/* medidor de repeticiones totales: el disparador de la subida */
.meter{padding:.55rem .9rem .3rem}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.68rem;color:var(--dust)}
.meter-top b{font-family:"IBM Plex Mono",monospace;font-size:.95rem;color:var(--chalk);font-weight:600}
.meter-top b.hit{color:var(--brass)}
.meter-top b.low{color:var(--warm)}
.track{position:relative;height:7px;background:var(--plate-hi);border-radius:4px;margin-top:.35rem;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--dust);border-radius:4px;transition:width .18s}
.track i.hit{background:var(--brass)}
.track i.low{background:var(--warm)}
.track u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--chalk);opacity:.55}

.rec{border-top:1px solid var(--edge);background:#151B23;padding:.55rem .9rem .65rem;
  display:flex;align-items:center;justify-content:space-between;gap:.7rem}
.rec-l{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dust)}
.rec-t{font-size:.72rem;color:var(--dust);margin-top:.15rem;line-height:1.35}
.rec-kg{font-family:"IBM Plex Mono",monospace;font-size:1.25rem;font-weight:600;white-space:nowrap}
.rec-kg.subir{color:var(--brass)}.rec-kg.bajar{color:var(--warm)}.rec-kg.mantener{color:var(--chalk)}

.cardio{background:var(--plate);border:1px solid var(--edge);border-radius:14px;margin-bottom:.8rem;padding:.8rem .9rem .9rem}
.cardio h3{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dust);font-weight:600;margin:0 0 .6rem}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.cgrid .l{font-size:.5rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dust);text-align:center;margin-bottom:.2rem}
.cgrid input{width:100%;background:var(--plate-hi);border:1px solid transparent;color:var(--chalk);
  font-family:"IBM Plex Mono",monospace;font-size:.92rem;font-weight:600;text-align:center;
  padding:.5rem .1rem;border-radius:9px;-moz-appearance:textfield}
.cgrid input:focus{outline:none;border-color:var(--brass);background:#28313d}

.block{background:var(--plate);border:1px solid var(--edge);border-radius:14px;margin-bottom:.8rem;padding:.85rem .9rem .9rem}
.block h2{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dust);font-weight:600;margin:0 0 .7rem}
.vt{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.vt th{font-size:.52rem;text-align:right;padding:0 0 .4rem .3rem;color:var(--dust);text-transform:uppercase}
.vt th:first-child{text-align:left;padding-left:0}
.vt td{font-size:.74rem;text-align:right;padding:.3rem 0 .3rem .3rem;border-top:1px solid #232B36}
.vt td:first-child{text-align:left;padding-left:0;color:var(--dust);font-size:.68rem}
.vt td.tot{color:var(--brass);font-weight:600}
.vt td.nil{color:var(--edge)}
.vt tr.now td{background:#20272F}
.bar{position:relative}
.bar i{position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--brass-dim);border-radius:1px}
.pex{border-top:1px solid var(--edge);padding:.7rem 0 .1rem}
.pex:first-of-type{border-top:0;padding-top:.1rem}
.pex-head{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.pex-n{font-size:.85rem;font-weight:600}
.pex-d{font-family:"IBM Plex Mono",monospace;font-size:.75rem;font-weight:600;white-space:nowrap}
.up{color:var(--brass)}.down{color:var(--warm)}.flat{color:var(--dust)}
.spark{display:flex;align-items:flex-end;gap:3px;height:38px;margin:.5rem 0 .3rem}
.spark div{flex:1;min-width:5px;background:var(--edge);border-radius:2px 2px 0 0}
.spark div.last{background:var(--brass)}
.pex-sub{font-size:.62rem;color:var(--dust);font-family:"IBM Plex Mono",monospace}
.body-grid{display:grid;grid-template-columns:2.4rem repeat(4,1fr);gap:.3rem;align-items:center}
.body-grid .hd{font-size:.53rem;text-transform:uppercase;color:var(--dust);text-align:center;padding-bottom:.15rem}
.body-grid .wk{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--dust)}
.body-grid input{width:100%;background:var(--plate-hi);border:1px solid transparent;color:var(--chalk);
  font-family:"IBM Plex Mono",monospace;font-size:.92rem;font-weight:600;text-align:center;
  padding:.5rem .1rem;border-radius:9px;-moz-appearance:textfield}
.body-grid input:focus{outline:none;border-color:var(--brass)}
.metric-sel{display:flex;gap:2px;background:var(--plate-hi);border-radius:10px;padding:2px;margin-bottom:.8rem}
.metric-sel button{flex:1;background:none;border:0;color:var(--dust);font:inherit;font-size:.66rem;font-weight:600;padding:.45rem 0;border-radius:8px;cursor:pointer}
.metric-sel button[aria-pressed="true"]{background:var(--brass);color:#0F1318}
.chart{width:100%;height:150px;display:block}
.chart .ln{fill:none;stroke:var(--brass);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--brass)}
.chart .gr{stroke:#232B36;stroke-width:1}
.chart text{fill:var(--dust);font-family:"IBM Plex Mono",monospace;font-size:9px}
.empty{color:var(--dust);font-size:.78rem;line-height:1.5}
.cfg{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.55rem 0;border-top:1px solid #232B36}
.cfg:first-of-type{border-top:0}
.cfg-n{font-size:.85rem;font-weight:600}
.cfg-s{font-size:.6rem;color:var(--dust);margin-top:.12rem}
.rng{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
.rng input{width:2.9rem;background:var(--plate-hi);border:1px solid transparent;color:var(--chalk);
  font-family:"IBM Plex Mono",monospace;font-size:.9rem;font-weight:600;text-align:center;
  padding:.45rem .1rem;border-radius:8px;-moz-appearance:textfield}
.rng input:focus{outline:none;border-color:var(--brass)}
.rng input.tot{color:var(--brass);width:3.2rem}
.rng span{color:var(--dust);font-size:.72rem}
.presets{display:flex;gap:.35rem;flex-wrap:wrap}
.presets button{flex:1;min-width:3.2rem;background:var(--plate-hi);border:1px solid transparent;color:var(--dust);
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;padding:.55rem 0;border-radius:9px;cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0F1318}
.sw{width:2.9rem;height:1.6rem;border-radius:1rem;background:var(--plate-hi);border:1px solid var(--edge);position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--dust);transition:left .15s,background .15s}
.sw[aria-pressed="true"]{background:var(--brass-dim);border-color:var(--brass)}
.sw[aria-pressed="true"]::after{left:calc(100% - 1.3rem);background:var(--brass)}

#rest{position:fixed;left:1rem;right:1rem;bottom:calc(env(safe-area-inset-bottom) + 4.4rem);z-index:30;
  background:var(--plate-hi);border:1px solid var(--brass-dim);border-radius:12px;padding:.6rem .8rem;
  display:flex;align-items:center;gap:.7rem;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#rest.fin{border-color:var(--brass);background:#3A3016}
#rest .rt{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;color:var(--brass);min-width:4rem}
#rest .rl{font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dust)}
#rest .sp{flex:1}
footer{position:fixed;bottom:0;left:0;right:0;z-index:20;
  padding:.7rem 1rem calc(env(safe-area-inset-bottom) + .7rem);
  background:linear-gradient(to top,var(--iron) 68%,transparent)}
.save{width:100%;padding:1rem;border:0;border-radius:12px;background:var(--brass);color:#0F1318;
  font:inherit;font-size:1rem;font-weight:600;cursor:pointer}
.save:disabled{background:var(--plate-hi);color:var(--dust)}
.status{text-align:center;font-size:.72rem;color:var(--dust);margin-bottom:.55rem;min-height:1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="viewtabs" id="viewTabs">
    <button type="button" data-v="registro">Registro</button>
    <button type="button" data-v="progresion">Progreso</button>
    <button type="button" data-v="cuerpo">Cuerpo</button>
    <button type="button" data-v="ajustes">Ajustes</button>
  </div>
  <div class="head-top">
    <div><h1 id="dayName"></h1><div class="muscles" id="muscles"></div></div>
    <div class="session-vol" id="volBox"><div class="v num" id="sessionVol">0</div><div class="l">kg totales</div></div>
  </div>
  <div class="controls" id="dayControls"><div class="seg" id="dayTabs"></div><select id="weekSel" aria-label="Semana"></select></div>
  <div class="clockbar" id="clockBar">
    <div class="t num" id="clockT">00:00</div>
    <button type="button" class="mini" id="clockBtn">Empezar</button>
    <div class="sp"></div>
    <button type="button" class="mini" id="restBtn">Descanso</button>
  </div>
</header>

<main id="viewRegistro"></main>
<main id="viewProgresion" class="hidden"></main>
<main id="viewCuerpo" class="hidden"></main>
<main id="viewAjustes" class="hidden"></main>

<div id="rest" class="hidden">
  <div><div class="rl">Descanso</div><div class="rt num" id="restT">0:00</div></div>
  <div class="sp"></div>
  <button type="button" class="mini" id="restMas">+30 s</button>
  <button type="button" class="mini" id="restStop">Parar</button>
</div>

<footer id="footerBar">
  <div class="status" id="status"></div>
  <button class="save" id="saveBtn">Guardar sesión</button>
</footer>

<script>

   CATÁLOGO. Cada ejercicio tiene su rango de repeticiones y,
   derivado de él, un objetivo de repeticiones totales entre las
   tres series: 2 × tope + suelo. Todo editable en Ajustes.
============================================================ */

  pullover:     {n:"Pullover en polea",              min:12, max:15},
  pressPlano:   {n:"Press plano",                    min:6,  max:10},
  pressInclin:  {n:"Press inclinado",                min:8,  max:12},

  pressMilitar: {n:"Press militar sentado",          min:6,  max:10},
  elevLaterales:{n:"Elevaciones laterales",          min:12, max:20},
  peckDeck:     {n:"Peck-deck inverso / pájaros",    min:12, max:20},
  /* retirados del plan, se conservan para el histórico */
  curlBiceps:   {n:"Curl de bíceps en polea",        min:10, max:15, fuera:true},

      ejercicios:["pressMilitar","elevLaterales","peckDeck"]}
};

        for(const j in ses[k]){ const v = ses[k][j];
          if(v && (v.kg != null || v.reps != null)) s[j] = v; }
        if(Object.keys(s).length) ej[layout[i]] = s;
      }
    }
    if(!Object.keys(ej).length) continue;
    out[dia+".s"+sem] = {ej, _meta:{dia, semana:sem, fecha:m.fecha || null,
      orden: m.orden ?? (sem*10 + DIAS[dia].idx),
      inicio:m.inicio ?? null, fin:m.fin ?? null, cardio:m.cardio ?? null}};
  }
  return out;
}

const sesiones = (()=>{
  for(const k of [KEY, "sesiones.v4", "sesiones.v3"]){
    const v = Store.get(k); if(v) return migrar(v);
  }
  return migrar(SEED.sesiones);
})();
const cuerpo  = Store.get(KEYC) || structuredClone(SEED.cuerpo || {});
const rangos  = Store.get(KEYR) || {};
const ajustes = Object.assign({descanso:180, autoDescanso:true, sonido:true},
                              SEED.ajustes || {}, Store.get(KEYA) || {});

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const nf = n => n.toLocaleString("es-ES",{maximumFractionDigits:1});
const ordenDe = (dia,semana) => semana*10 + DIAS[dia].idx;
const fmtT = s => { s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), g = s%60;
  return (h? h+":"+String(m).padStart(2,"0") : String(m)) + ":" + String(g).padStart(2,"0"); };
function rango(id){
  const r = rangos[id] || {}, d = CAT[id] || {min:8,max:12};
  const min = r.min ?? d.min, max = r.max ?? d.max;
  return {min, max, total: r.total ?? (2*max + min)};
}

/* ============================================================
   MOTOR DE SOBRECARGA — por volumen total

   Un solo peso por ejercicio y tres series al fallo.
   Se suman las repeticiones de las tres series y se compara
   con el objetivo total del ejercicio (por defecto 2 × tope + suelo):

     · total ≥ objetivo        → subir peso (2,5% si el suelo < 10, si no 4%)
     · total < 3 × suelo       → el peso se ha quedado grande, bajarlo
     · entre medias            → mismo peso, sumar repeticiones

   El RIR se registra pero no entra en el cálculo.
   El encadenado es por ejercicio y en orden cronológico: la sesión
   anterior es la última en que se hizo, esté en el día que esté.
============================================================ */
const pesoDe = ejd => {            /* el peso de referencia es el del medio */
  const ks = [0,1,2].map(j=>ejd?.[j]?.kg).filter(k=>k!=null).sort((a,b)=>a-b);
  return ks.length ? ks[Math.floor(ks.length/2)] : null;
};
const repsTotal = ejd => [0,1,2].reduce((t,j)=> t + (ejd?.[j]?.reps || 0), 0);
const seriesHechas = ejd => [0,1,2].filter(j=> ejd?.[j]?.reps != null).length;

function recomendar(ejId, ejd){
  const kg = pesoDe(ejd); if(kg == null) return null;
  const r = rango(ejId), total = repsTotal(ejd), n = seriesHechas(ejd);
  const pct = r.min < 10 ? .025 : .04;
  const s1 = ejd?.[0]?.reps;
  if(n < 3){
    /* aviso en caliente: la primera serie ya dice que el peso es excesivo */
    if(s1 != null && s1 < r.min)
      return {kg:Math.round(kg*(1-pct)*2)/2, estado:"aviso", pct, total, r, desde:kg, s1};
    return {kg, estado:"incompleto", total, r, desde:kg};
  }
  if(total >= r.total)
    return {kg:Math.round(kg*(1+pct)*2)/2, estado:"subir", pct, total, r, desde:kg};
  if(total < r.min*3)
    return {kg:Math.round(kg*(1-pct)*2)/2, estado:"bajar", pct, total, r, desde:kg};
  return {kg, estado:"mantener", total, r, desde:kg};
}
function sesionAnterior(ejId, orden){
  let mejor = null;
  for(const clave in sesiones){
    const s = sesiones[clave], m = s?._meta;
    if(!m || m.orden >= orden || !s.ej[ejId]) continue;
    if(!mejor || m.orden > mejor.orden)
      mejor = {orden:m.orden, dia:m.dia, semana:m.semana, datos:s.ej[ejId]};
  }
  return mejor;
}

/* ---------- Agregados ---------- */
const volEjer = ejd => [0,1,2].reduce((t,j)=>{
  const s = ejd?.[j]; return t + ((s && s.kg && s.reps) ? s.kg*s.reps : 0); }, 0);
function volSesion(dia, semana){
  const s = sesiones[dia+".s"+semana]; if(!s) return 0;
  return Object.values(s.ej).reduce((t,e)=> t + volEjer(e), 0);
}
function duracionSesion(dia, semana){
  const m = sesiones[dia+".s"+semana]?._meta;
  return m?.inicio ? Math.round(((m.fin || Date.now()) - m.inicio)/1000) : 0;
}
function historial(ejId){
  const out = [];
  for(const clave in sesiones){
    const s = sesiones[clave], m = s._meta;
    if(!s.ej[ejId]) continue;
    const v = volEjer(s.ej[ejId]); if(!v) continue;
    out.push({orden:m.orden, dia:m.dia, semana:m.semana, vol:v,
      kg:pesoDe(s.ej[ejId]), reps:repsTotal(s.ej[ejId])});
  }
  return out.sort((a,b)=> a.orden - b.orden);
}
const EJERCICIOS = (()=>{
  const m = new Map();
  claves.forEach(d => DIAS[d].ejercicios.forEach(id=>{
    if(!m.has(id)) m.set(id, {id, dias:[]}); m.get(id).dias.push(d); }));
  for(const c in sesiones) for(const id in sesiones[c].ej)
    if(!m.has(id) && CAT[id]) m.set(id, {id, dias:[]});
  return [...m.values()];
})();

/* ---------- Estado ---------- */
let vista = "registro", dia = "d1", semana = 1, datos = {}, metrica = "peso";
(()=>{
  const g = Store.get("ultima.v5");
  if(g && DIAS[g.dia]){ dia = g.dia; semana = g.semana; return; }
  let mejor = null;
  for(const c in sesiones){ const m = sesiones[c]._meta;
    if(!mejor || m.orden > mejor.orden) mejor = m; }
  if(mejor){ dia = DIAS[mejor.dia] ? mejor.dia : "d1"; semana = mejor.semana; }
})();
const idSesion = () => dia+".s"+semana;

$("weekSel").innerHTML = Array.from({length:16},(_,i)=>`<option value="${i+1}">Sem ${i+1}</option>`).join("");
$("dayTabs").innerHTML = claves.map(k=>`<button type="button" data-dia="${k}">${DIAS[k].corto}</button>`).join("");

function celda(id, j){ datos[id] ??= {}; datos[id][j] ??= {}; return datos[id][j]; }
function onKg(ev){
  const id = ev.target.dataset.kg;
  const v = ev.target.value === "" ? null : parseFloat(ev.target.value);
  [0,1,2].forEach(j => celda(id,j).kg = v);      /* un solo peso para las tres */
  guardarEnMemoria(); pintarEjercicio(id); pintarSesion();
}
function onReps(ev){
  const {e,s} = ev.target.dataset;
  const v = ev.target.value === "" ? null : parseInt(ev.target.value);
  celda(e,s).reps = v;
  guardarEnMemoria(); pintarEjercicio(e); pintarSesion();
}
function onRir(ev){
  const {e,s,rir} = ev.target.dataset;
  const c = celda(e,s), ya = c.rir === +rir;
  c.rir = ya ? null : +rir;
  guardarEnMemoria(); pintarEjercicio(e);
  if(!ya && ajustes.autoDescanso) iniciarDescanso();
}
function onCardio(){
  const c = {};
  document.querySelectorAll("[data-c]").forEach(i=>{
    if(i.value !== "") c[i.dataset.c] = parseFloat(i.value); });
  guardarEnMemoria();
  sesiones[idSesion()]._meta.cardio = Object.keys(c).length ? c : null;
  Store.set(KEY, sesiones);
}
function guardarEnMemoria(){
  const prev = sesiones[idSesion()]?._meta || {};
  const limpio = {};
  for(const id in datos){
    const s = {};
    for(const j in datos[id]){ const v = datos[id][j];
      if(v && (v.kg != null || v.reps != null)) s[j] = v; }
    if(Object.keys(s).length) limpio[id] = s;
  }
  sesiones[idSesion()] = {ej:limpio, _meta:{dia, semana, orden:ordenDe(dia,semana),
    fecha: prev.fecha || new Date().toISOString().slice(0,10),
    inicio: prev.inicio ?? null, fin: prev.fin ?? null, cardio: prev.cardio ?? null}};
}
function pintarEjercicio(id){
  const r = rango(id), ejd = datos[id];
  [0,1,2].forEach(j=>{
    const reps = ejd?.[j]?.reps;
    document.querySelectorAll(`#sc-${id}-${j} .tick`).forEach((t,k)=>{
      const n = r.min+k;
      t.className = "tick" + (reps >= n ? (n === r.max ? " top" : " on") : "");
    });
    const inp = document.querySelector(`.reps[data-e="${id}"][data-s="${j}"]`);
    if(inp){ inp.classList.toggle("filled", reps != null);
      inp.classList.toggle("bajo", reps != null && reps < r.min); }
    document.querySelectorAll(`#viewRegistro .rir button[data-e="${id}"][data-s="${j}"]`).forEach(b=>
      b.setAttribute("aria-pressed", +b.dataset.rir === ejd?.[j]?.rir));
  });
  pintarMedidor(id); pintarRec(id);
}
function pintarMedidor(id){
  const r = rango(id), total = repsTotal(datos[id]), caja = $("me-"+id);
  const suelo = r.min*3;
  const hit = total >= r.total, low = total > 0 && seriesHechas(datos[id]) === 3 && total < suelo;
  const w = Math.min(100, Math.round(total / r.total * 100));
  caja.innerHTML = `<div class="meter-top"><span>Repeticiones totales</span>
      <span><b class="${hit?"hit":low?"low":""}">${total}</b> / ${r.total}</span></div>
    <div class="track"><i class="${hit?"hit":low?"low":""}" style="width:${w}%"></i>
      <u style="left:${Math.round(suelo/r.total*100)}%"></u></div>`;
}
function pintarRec(id){
  const caja = $("rec-"+id), rec = recomendar(id, datos[id]);
  if(rec && rec.estado === "aviso"){
    caja.innerHTML = `<div><div class="rec-l" style="color:var(--warm)">Baja el peso ya</div>
      <div class="rec-t">La primera serie se ha quedado en ${rec.s1} repeticiones, por debajo del suelo de
        ${rec.r.min}. Con ${nf(rec.desde)} kg no vas a llegar al objetivo: prueba estos para las que faltan.</div></div>
      <div class="rec-kg bajar">${nf(rec.kg)} kg</div>`;
    caja.style.display = ""; return;
  }
  if(rec && rec.estado !== "incompleto"){
    const txt = {
      subir:   `Objetivo cumplido: ${rec.total} de ${rec.r.total}. Sube un ${nf(rec.pct*100)}% desde ${nf(rec.desde)} kg.`,
      bajar:   `Solo ${rec.total} repeticiones, por debajo del suelo de ${rec.r.min*3}. El peso se te ha quedado grande: baja un ${nf(rec.pct*100)}%.`,
      mantener:`${rec.total} de ${rec.r.total}. Mismo peso y a sumar repeticiones.`
    }[rec.estado];
    caja.innerHTML = `<div><div class="rec-l">Próxima sesión</div><div class="rec-t">${txt}</div></div>
      <div class="rec-kg ${rec.estado}">${nf(rec.kg)} kg</div>`;
    caja.style.display = ""; return;
  }
  const prev = sesionAnterior(id, ordenDe(dia,semana));
  const obj = prev ? recomendar(id, prev.datos) : null;
  if(obj){
    caja.innerHTML = `<div><div class="rec-l">Objetivo hoy</div>
      <div class="rec-t">Desde ${DIAS[prev.dia]?.corto || prev.dia} · semana ${prev.semana}
        (${obj.total} reps${obj.estado==="subir"?", objetivo cumplido":""}).</div></div>
      <div class="rec-kg ${obj.estado==="subir"?"subir":"mantener"}">${nf(obj.kg)} kg</div>`;
    caja.style.display = "";
  } else { caja.innerHTML = ""; caja.style.display = "none"; }
}
function pintarSesion(){
  const total = Object.values(datos).reduce((t,e)=> t+volEjer(e), 0);

/* ---------- Cronómetro y descanso ---------- */
function metaActual(){ if(!sesiones[idSesion()]) guardarEnMemoria(); return sesiones[idSesion()]._meta; }
function pintarReloj(){
  const m = sesiones[idSesion()]?._meta;
  const run = !!(m?.inicio && !m.fin);
  $("clockT").textContent = fmtT(m?.inicio ? ((m.fin || Date.now()) - m.inicio)/1000 : 0);
  $("clockT").classList.toggle("run", run);
  $("clockBtn").textContent = run ? "Parar" : (m?.inicio ? "Reanudar" : "Empezar");
  $("clockBtn").classList.toggle("on", run);
}
$("clockBtn").addEventListener("click", ()=>{
  const m = metaActual();
  if(m.inicio && !m.fin) m.fin = Date.now();
  else if(m.inicio && m.fin){ m.inicio += (Date.now() - m.fin); m.fin = null; }
  else { m.inicio = Date.now(); m.fin = null; }
  Store.set(KEY, sesiones); pintarReloj();
});
let finDescanso = 0, avisado = false, audio = null;
function iniciarDescanso(seg){
  finDescanso = Date.now() + (seg ?? ajustes.descanso)*1000;
  avisado = false; $("rest").classList.remove("hidden","fin"); pintarDescanso();
}
function pararDescanso(){ finDescanso = 0; $("rest").classList.add("hidden"); }
function pintarDescanso(){
  if(!finDescanso) return;
  const resto = (finDescanso - Date.now())/1000;
  $("restT").textContent = fmtT(Math.abs(resto));
  if(resto <= 0 && !avisado){ avisado = true; $("rest").classList.add("fin"); pitar(); }
}
$("restBtn").addEventListener("click", ()=> finDescanso ? pararDescanso() : iniciarDescanso());
$("restStop").addEventListener("click", pararDescanso);
$("restMas").addEventListener("click", ()=>{
  finDescanso = Math.max(Date.now(), finDescanso) + 30000;
  avisado = false; $("rest").classList.remove("fin"); pintarDescanso(); });
function pitar(){
  if(!ajustes.sonido) return;
  try{
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === "suspended") audio.resume();
    [0,.18,.36].forEach(t=>{
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.0001, audio.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.25, audio.currentTime+t+.01);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+t+.13);
      o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.14);
    });
  }catch(e){}
}
setInterval(()=>{ if(vista === "registro") pintarReloj(); pintarDescanso(); }, 500);

/* ============================================================
   VISTA 2 · PROGRESO
============================================================ */
function pintarProgresion(){
  const todas = []; let maxTot = 0, ultima = 3;
  for(let s=1; s<=16; s++){
    const v = claves.map(d => volSesion(d,s));
    const t = claves.map(d => duracionSesion(d,s));
    const car = claves.map(d => sesiones[d+".s"+s]?._meta?.cardio || null);
    const tot = v.reduce((a,b)=>a+b,0);
    maxTot = Math.max(maxTot, tot);
    if(tot > 0) ultima = s;
    todas.push({s, v, t, car, tot, tTot:t.reduce((a,b)=>a+b,0),
      cMin:car.reduce((a,c)=> a+(c?.min||0),0), cKm:car.reduce((a,c)=> a+(c?.km||0),0),
      cKcal:car.reduce((a,c)=> a+(c?.kcal||0),0)});
  }
  const filas = todas.filter(f => f.s <= Math.max(3, ultima));
  const cab = `<tr><th>Sem</th>${claves.map(d=>`<th>${DIAS[d].corto}</th>`).join("")}<th>Total</th></tr>`;

  const tablaVol = `<div class="block"><h2>Volumen semanal · kg levantados</h2>
    <table class="vt"><thead>${cab}</thead><tbody>${filas.map(f=>`<tr class="${f.s===semana?"now":""}">
      <td>${f.s}</td>${f.v.map(x=>`<td class="${x?"":"nil"}">${x?nf(x):"·"}</td>`).join("")}
      <td class="tot bar">${f.tot?nf(f.tot):"·"}${f.tot?`<i style="width:${Math.round(f.tot/maxTot*100)}%"></i>`:""}</td>
    </tr>`).join("")}</tbody></table></div>`;

  const hayT = todas.some(f => f.tTot > 0);
  const tablaT = `<div class="block"><h2>Duración de las sesiones · minutos</h2>
    ${hayT ? `<table class="vt"><thead>${cab}</thead><tbody>${filas.map(f=>`<tr class="${f.s===semana?"now":""}">
      <td>${f.s}</td>${f.t.map(x=>`<td class="${x?"":"nil"}">${x?Math.round(x/60):"·"}</td>`).join("")}
      <td class="tot">${f.tTot?Math.round(f.tTot/60):"·"}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Pulsa "Empezar" al comenzar un entrenamiento y "Parar" al terminarlo.</div>`}</div>`;

  const hayC = todas.some(f => f.cMin > 0);
  const tablaC = `<div class="block"><h2>Cardio por semana</h2>
    ${hayC ? `<table class="vt"><thead><tr><th>Sem</th><th>Min</th><th>Km</th><th>Kcal</th></tr></thead>
      <tbody>${filas.filter(f=>f.cMin>0).map(f=>`<tr class="${f.s===semana?"now":""}">
        <td>${f.s}</td><td>${f.cMin}</td><td>${f.cKm?nf(f.cKm):"·"}</td>
        <td class="tot">${f.cKcal?nf(f.cKcal):"·"}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Apunta el cardio al final de cada sesión y aquí verás el acumulado semanal.</div>`}</div>`;

  const bloques = EJERCICIOS.map(ej=>{
    const h = historial(ej.id), def = CAT[ej.id];
    const etiq = ej.dias.length ? ej.dias.map(d=>DIAS[d].corto).join(" · ") : "fuera del plan";
    if(!h.length) return `<div class="pex"><div class="pex-head"><div class="pex-n">${def.n}</div>
      <div class="pex-d flat">sin datos</div></div><div class="pex-sub">${etiq}</div></div>`;
    const maxV = Math.max(...h.map(x=>x.vol)), a = h[0], b = h[h.length-1];
    const dv = a.vol ? (b.vol-a.vol)/a.vol*100 : 0;
    const cls = dv > 1 ? "up" : dv < -1 ? "down" : "flat";
    return `<div class="pex">
      <div class="pex-head"><div class="pex-n">${def.n}</div>
        <div class="pex-d ${cls}">${dv>0?"+":""}${nf(dv)} %</div></div>
      <div class="spark">${h.map((x,k)=>`<div class="${k===h.length-1?"last":""}"
        style="height:${Math.max(5,Math.round(x.vol/maxV*38))}px"></div>`).join("")}</div>
      <div class="pex-sub">${etiq} · ${h.length} sesiones</div>
      <div class="pex-sub" style="margin-top:.25rem;color:var(--chalk)">
        ${nf(a.vol)} → <b>${nf(b.vol)}</b> kg · carga ${nf(a.kg)} → <b>${nf(b.kg)}</b> kg</div></div>`;
  }).join("");

  $("viewProgresion").innerHTML = tablaVol + tablaT + tablaC +
    `<div class="block"><h2>Progresión por ejercicio · cronológica</h2>${bloques}</div>` +
    `<div class="block"><h2>Copia de seguridad</h2>
      <div class="empty" style="margin-bottom:.7rem">Todo: sesiones, cardio, cuerpo, rangos y ajustes.</div>
      <div style="display:flex;gap:.5rem">
        <button type="button" class="save" id="btnExport" style="flex:1;padding:.75rem;font-size:.85rem">Descargar copia</button>
        <button type="button" class="save" id="btnImport" style="flex:1;padding:.75rem;font-size:.85rem;background:var(--plate-hi);color:var(--chalk)">Restaurar</button>
      </div>
      <input type="file" id="fileImport" accept="application/json,.json" class="hidden">
      <div class="pex-sub" id="ioMsg" style="margin-top:.6rem"></div></div>`;
  $("btnExport").addEventListener("click", exportar);
  $("btnImport").addEventListener("click", ()=> $("fileImport").click());
  $("fileImport").addEventListener("change", importar);
}
function exportar(){
  const blob = new Blob([JSON.stringify({version:5, sesiones, cuerpo, rangos, ajustes}, null, 1)],
    {type:"application/json"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "entreno-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  $("ioMsg").textContent = "Copia descargada.";
}
function importar(ev){
  const f = ev.target.files?.[0]; if(!f) return;
  const lector = new FileReader();
  lector.onload = ()=>{
    try{
      const d = JSON.parse(lector.result);
      if(!d?.sesiones) throw new Error("formato");
      if(!confirm("Esto sustituye todo lo que hay ahora en la app. ¿Continuar?")) return;
      const conv = migrar(d.sesiones);
      for(const k in sesiones) delete sesiones[k]; Object.assign(sesiones, conv);
      for(const k in cuerpo) delete cuerpo[k]; Object.assign(cuerpo, d.cuerpo || {});
      for(const k in rangos) delete rangos[k]; Object.assign(rangos, d.rangos || {});
      Object.assign(ajustes, d.ajustes || {});
      Store.set(KEY, sesiones); Store.set(KEYC, cuerpo);
      Store.set(KEYR, rangos); Store.set(KEYA, ajustes);
      pintarProgresion();
      $("ioMsg").textContent = Object.keys(conv).length + " sesiones restauradas.";
    }catch(e){ $("ioMsg").textContent = "Ese archivo no es una copia válida."; }
    ev.target.value = "";
  };
  lector.readAsText(f);
}

/* ============================================================
   VISTA 3 · CUERPO
============================================================ */
const METRICAS = {
  peso:   {l:"Peso",   u:"kg", get:c=>c.peso},
  grasa:  {l:"Grasa",  u:"%",  get:c=>c.grasa},
  magra:  {l:"Magra",  u:"kg", get:c=>(c.peso!=null&&c.grasa!=null)?Math.round(c.peso*(1-c.grasa/100)*10)/10:null},
  cintura:{l:"Cintura",u:"cm", get:c=>c.cintura}
};
function pintarCuerpo(){
  const m = METRICAS[metrica], pts = [];
  for(let s=1; s<=16; s++){ const v = cuerpo[s] ? m.get(cuerpo[s]) : null;
    if(v != null && !isNaN(v)) pts.push({s, v}); }
  $("viewCuerpo").innerHTML = `
    <div class="block"><h2>Evolución</h2>
      <div class="metric-sel">${Object.keys(METRICAS).map(k=>
        `<button type="button" data-m="${k}" aria-pressed="${k===metrica}">${METRICAS[k].l}</button>`).join("")}</div>
      ${pts.length>=2 ? grafico(pts,m)+resumen(pts,m)
        : `<div class="empty">Apunta ${m.l.toLowerCase()} en al menos dos semanas y aquí verás la curva.</div>`}
    </div>
    <div class="block"><h2>Registro semanal</h2>
      <div class="body-grid">
        <div></div><div class="hd">Peso kg</div><div class="hd">Grasa %</div><div class="hd">Cintura cm</div><div class="hd">Pasos/día</div>
        ${Array.from({length:16},(_,i)=>{ const s=i+1, c=cuerpo[s]||{};
          return `<div class="wk">S${s}</div>` + ["peso","grasa","cintura","pasos"].map(k=>
            `<input type="number" inputmode="decimal" step="${k==="pasos"?"100":"0.1"}" min="0"
               data-w="${s}" data-k="${k}" value="${c[k]??""}" placeholder="–">`).join("");}).join("")}
      </div></div>`;
  $("viewCuerpo").querySelectorAll(".metric-sel button").forEach(b=>
    b.addEventListener("click", ()=>{ metrica = b.dataset.m; pintarCuerpo(); }));
  $("viewCuerpo").querySelectorAll(".body-grid input").forEach(inp=>
    inp.addEventListener("input", ev=>{
      const {w,k} = ev.target.dataset;
      const v = ev.target.value === "" ? null : parseFloat(ev.target.value);
      cuerpo[w] ??= {};
      if(v == null) delete cuerpo[w][k]; else cuerpo[w][k] = v;
      Store.set(KEYC, cuerpo);
    }));
}
function grafico(pts, m){
  const W=320,H=150,P={t:12,r:8,b:20,l:34};
  const xs=pts.map(p=>p.s), ys=pts.map(p=>p.v);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=(y1-y0)*.25 || Math.max(1,y1*.02); y0-=pad; y1+=pad;
  const px=s=>P.l+(x1===x0?0:(s-x0)/(x1-x0))*(W-P.l-P.r);
  const py=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b);
  const d=pts.map((p,i)=>(i?"L":"M")+px(p.s).toFixed(1)+" "+py(p.v).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución de ${m.l}">
    ${[0,.5,1].map(f=>{const y=P.t+f*(H-P.t-P.b);
      return `<line class="gr" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}"/><text x="2" y="${y+3}">${nf(y1-f*(y1-y0))}</text>`;}).join("")}
    <path class="ln" d="${d}"/>
    ${pts.map(p=>`<circle class="dot" cx="${px(p.s).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="3"/>`).join("")}
    ${pts.map(p=>`<text x="${px(p.s).toFixed(1)}" y="${H-6}" text-anchor="middle">S${p.s}</text>`).join("")}</svg>`;
}
function resumen(pts, m){
  const a=pts[0], b=pts[pts.length-1], d=b.v-a.v;
  const cls = Math.abs(d)<.05 ? "flat"
    : (metrica==="grasa"||metrica==="cintura") ? (d<0?"up":"down") : (d>0?"up":"down");
  return `<div class="pex-sub" style="margin-top:.6rem;color:var(--chalk)">Semana ${a.s} → ${b.s}:
    ${nf(a.v)} → <b>${nf(b.v)}</b> ${m.u} <span class="${cls}">(${d>0?"+":""}${nf(d)} ${m.u})</span></div>`;
}

/* ============================================================
   VISTA 4 · AJUSTES
============================================================ */
function pintarAjustes(){
  const presets = [60,90,120,150,180,240];
  $("viewAjustes").innerHTML = `
    <div class="block"><h2>Temporizador de descanso</h2>
      <div class="presets" id="presetsDesc">${presets.map(p=>
        `<button type="button" data-p="${p}" aria-pressed="${ajustes.descanso===p}">${p<60?p+"s":(p/60)+" min"}</button>`).join("")}</div>
      <div class="cfg" style="margin-top:.7rem">
        <div><div class="cfg-n">Arrancar solo</div><div class="cfg-s">Empieza al marcar el RIR de una serie</div></div>
        <button type="button" class="sw" id="swAuto" aria-pressed="${!!ajustes.autoDescanso}"></button></div>
      <div class="cfg">
        <div><div class="cfg-n">Aviso sonoro</div><div class="cfg-s">Tres pitidos al terminar</div></div>
        <button type="button" class="sw" id="swSon" aria-pressed="${!!ajustes.sonido}"></button></div>
    </div>

    <div class="block"><h2>Rangos y objetivo de repeticiones</h2>
      <div class="empty" style="margin-bottom:.6rem">Los dos primeros números son el suelo y el tope del rango.
        El tercero, en dorado, es el objetivo de repeticiones totales entre las tres series: cuando lo alcanzas,
        sube el peso. Por defecto es 2 × tope + suelo. El suelo además decide el incremento:
        por debajo de 10 sube un 2,5%, de 10 en adelante un 4%.</div>
      ${EJERCICIOS.filter(e=>!CAT[e.id].fuera).map(ej=>{ const r = rango(ej.id), d = CAT[ej.id];
        return `<div class="cfg">
          <div><div class="cfg-n">${d.n}</div>
            <div class="cfg-s">${ej.dias.map(x=>DIAS[x].corto).join(" · ")} · bajada si no llega a ${r.min*3}</div></div>
          <div class="rng">
            <input type="number" inputmode="numeric" min="1" max="50" data-r="${ej.id}" data-b="min" value="${r.min}">
            <span>–</span>
            <input type="number" inputmode="numeric" min="1" max="50" data-r="${ej.id}" data-b="max" value="${r.max}">
            <span>·</span>
            <input type="number" inputmode="numeric" min="3" max="200" class="tot" data-r="${ej.id}" data-b="total" value="${r.total}">
          </div></div>`;}).join("")}
      <button type="button" class="save" id="resetRangos"
        style="margin-top:.8rem;padding:.7rem;font-size:.82rem;background:var(--plate-hi);color:var(--chalk)">Volver a los valores por defecto</button>
    </div>`;
  $("presetsDesc").addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    ajustes.descanso = +b.dataset.p; Store.set(KEYA, ajustes); pintarAjustes(); });
  $("swAuto").addEventListener("click", ()=>{
    ajustes.autoDescanso = !ajustes.autoDescanso; Store.set(KEYA, ajustes); pintarAjustes(); });
  $("swSon").addEventListener("click", ()=>{
    ajustes.sonido = !ajustes.sonido; Store.set(KEYA, ajustes); if(ajustes.sonido) pitar(); pintarAjustes(); });
  $("viewAjustes").querySelectorAll("[data-r]").forEach(inp=>
    inp.addEventListener("change", ev=>{
      const {r:id, b} = ev.target.dataset, act = rango(id);
      const v = parseInt(ev.target.value);
      if(isNaN(v) || v < 1){ pintarAjustes(); return; }
      const nuevo = {min:act.min, max:act.max, total:act.total};
      nuevo[b] = v;
      if(nuevo.min > nuevo.max){ if(b==="min") nuevo.max = nuevo.min; else nuevo.min = nuevo.max; }
      if(b === "min" || b === "max") nuevo.total = 2*nuevo.max + nuevo.min;   /* se recalcula solo */
      rangos[id] = nuevo; Store.set(KEYR, rangos); pintarAjustes();
    }));
  $("resetRangos").addEventListener("click", ()=>{
    if(!confirm("Se vuelven a los rangos y objetivos originales. ¿Seguro?")) return;
    for(const k in rangos) delete rangos[k]; Store.set(KEYR, rangos); pintarAjustes(); });
}

/* ============================================================
   NAVEGACIÓN
============================================================ */
function irA(v){
  vista = v;
  document.querySelectorAll("#viewTabs button").forEach(b=> b.setAttribute("aria-pressed", b.dataset.v===v));
  ["registro","progresion","cuerpo","ajustes"].forEach(k=>
    $("view"+k[0].toUpperCase()+k.slice(1)).classList.toggle("hidden", k!==v));
  const esReg = v === "registro";
  $("dayControls").classList.toggle("hidden", !esReg);
  $("clockBar").classList.toggle("hidden", !esReg);
  $("footerBar").classList.toggle("hidden", !esReg);
  $("volBox").classList.toggle("hidden", !esReg);
  document.body.style.paddingBottom = esReg ? "5.5rem" : "1.5rem";
  if(esReg) cargar();
  if(v === "progresion"){ $("dayName").textContent = "Progreso";
    $("muscles").textContent = "Sobrecarga por volumen total"; pintarProgresion(); }
  if(v === "cuerpo"){ $("dayName").textContent = "Cuerpo";
    $("muscles").textContent = "Peso · Grasa · Cintura · Pasos"; pintarCuerpo(); }
  if(v === "ajustes"){ $("dayName").textContent = "Ajustes";
    $("muscles").textContent = "Descanso, rangos y objetivos"; pintarAjustes(); }
  window.scrollTo(0,0);
}
$("viewTabs").addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  if(vista === "registro") guardar();
  irA(b.dataset.v); });
$("dayTabs").addEventListener("click", ev=>{
  const b = ev.target.closest("button"); if(!b) return;
  guardar(); dia = b.dataset.dia; Store.set("ultima.v5",{dia,semana}); cargar(); });
$("weekSel").addEventListener("change", ev=>{
  guardar(); semana = +ev.target.value; Store.set("ultima.v5",{dia,semana}); cargar(); });
$("saveBtn").addEventListener("click", ()=>{
  const m = metaActual();
  if(m.inicio && !m.fin) m.fin = Date.now();
  guardar();
  $("status").textContent = "Sesión guardada" + (m.inicio ? " · " + fmtT((m.fin-m.inicio)/1000) : "") + ".";
  setTimeout(()=> $("status").textContent = "", 3000);
  pintarReloj(); });
function guardar(){
  if(!Object.keys(datos).length && !sesiones[idSesion()]) return;
  const prev = sesiones[idSesion()]?._meta;
  guardarEnMemoria();
  if(prev) Object.assign(sesiones[idSesion()]._meta,
    {inicio:prev.inicio, fin:prev.fin, fecha:prev.fecha, cardio:prev.cardio});
  Store.set(KEY, sesiones);
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && vista==="registro") guardar(); });
window.addEventListener("pagehide", ()=>{ if(vista==="registro") guardar(); });

irA("registro");
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
